<!-- MathJax config (site-wide). Must run BEFORE the loader below.
     matchFontHeight:false stops MathJax from sizing math by MEASURING the
     surrounding font: that measurement reads getBoundingClientRect, which
     returns ZOOMED pixels under the site-wide body{zoom} (sam-styles.css, sec.
     2), so math rendered ~zoom-factor too big on any page with real math (e.g.
     news.shtml, the SVD tutorial). With it off, math renders at the container's
     real font-size and scales with the page like the surrounding text.
     This MERGES rather than overwrites, so a page that set its own config
     before this include (e.g. to enable $...$ delimiters) keeps it. Default
     \(...\) / \[...\] / \begin{}...\end{} delimiters need no page config; $...$
     is deliberately NOT enabled site-wide so literal dollar signs in prose are
     not treated as math. -->
<script>
  window.MathJax = window.MathJax || {};
  window.MathJax.chtml = window.MathJax.chtml || {};
  if (window.MathJax.chtml.matchFontHeight === undefined) {
    window.MathJax.chtml.matchFontHeight = false;
  }
</script>

<!-- Safari's bfcache restores pages with a stale paint that does not
respect the current `body { zoom }` value. When the browser brings
a page back from the back/forward cache, tickle body.zoom to force
a repaint at the right scale. -->
<script>
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) {
      var b = document.body;
      var z = window.getComputedStyle(b).zoom;
      b.style.zoom = '1';
      void b.offsetHeight;       /* force reflow */
      b.style.zoom = z || '';
    }
  });
</script>
